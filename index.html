<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Karol Case</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>KAROL CASE</h1>

  <main>

    <button>VER CASES</button>
  </section>

  <section class="favorites">
    <h2>✨ Nuestros favoritos</h2>
    <p>Descubre algunos de nuestros diseños.</p>

    <div class="products">

      <article class="product-card">
        <div class="product-image">
  <span>Foto del case</span>
</div>

        <h3>Case Tejido Beige</h3>
        <p class="price">$XX</p>

        <button>Agregar al carrito</button>
      </article>

      <article class="product-card">
        <div class="product-image">
  <span>Foto del case</span>
</div>

        <h3>Case Animal Print</h3>
        <p class="price">$XX</p>

        <button>Agregar al carrito</button>
      </article>

      <article class="product-card">
        <div class="product-image">
  <span>Foto del case</span>
</div>

        <h3>Case Tejido Borgoña</h3>
        <p class="price">$XX</p>

        <button>Agregar al carrito</button>
      </article>

    </div>
  </section>

</main>
</body>
</html>
